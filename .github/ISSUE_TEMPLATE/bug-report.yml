name: Bug Report
description: File a bug report.
title: "[Bug]: "
labels: ["bug", "triage"]
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
      value: "A detailed description of the bug and steps to reproduce, expected vs actual behavior."
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Wich of these best describes the type of problem?
      options:
        - Unknown or Other
        - Visual difference
        - Missing content
        - Authoring problem
        - Site interactivity
      default: 0
    validations:
      required: true
  - type: dropdown
    id: browsers
    attributes:
      label: What browsers are you seeing the problem on?
      multiple: true
      options:
        - Firefox
        - Chrome
        - Safari
        - Microsoft Edge
  - type: dropdown
    id: breakpoints
    attributes:
      label: Which breakpoints (screen widths) are you seeing the problem on?
      multiple: true
      options:
        - Desktop
        - Tablet
        - Mobile
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false
